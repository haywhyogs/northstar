# One-off task: bring the database schema up to date (alembic upgrade head) before the new version starts.
# A Job runs to completion and stops. The deploy script deletes the old Job first, because a Job can't be edited.
apiVersion: batch/v1
kind: Job
metadata:
  name: payments-migrate
spec:
  backoffLimit: 3 # retry up to 3 times (e.g. while the serverless database wakes up)
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-migrate
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: payments
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: payments-backend # replaced per environment: <registry>/payments-backend:<git-sha>
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: payments-config
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
