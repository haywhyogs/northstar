[project]
name = "northstar-payments"
version = "0.1.0"
description = "Northstar Payments workload: API, outbox dispatcher and payment worker (one image, three processes)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0.36",        # talks to the database in Python instead of raw SQL strings
    "alembic>=1.14",             # database migrations ("renovation instructions")
    "pyodbc>=5.2",               # Python ↔ ODBC Driver 18 ↔ SQL Server
    "pydantic-settings>=2.6",    # reads configuration from environment variables / .env
    "fastapi>=0.163.2",
    "uvicorn[standard]>=0.54.0",
    "pyjwt>=2.15.1",
    "azure-servicebus>=7.15.0",
    "azure-identity>=1.19",          # passwordless sign-in: workload identity in AKS, az login on a laptop
    "azure-keyvault-secrets>=4.9",   # reads the JWT signing key from Key Vault
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northstar_payments"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.format]
# Generated migration files keep Alembic's layout; they're reviewed, not reformatted.
exclude = ["migrations/versions/*"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection style (`x = Depends(...)`) is intended, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local SQL Server (docker compose up -d) with migrations applied"]
