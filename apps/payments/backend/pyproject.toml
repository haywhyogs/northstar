[project]
name = "northstar-payments"
version = "0.1.0"
description = "Northstar Payments workload: API, outbox dispatcher and payment worker (one image, three processes)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0.36",        # talks to the database in Python instead of raw SQL strings
    "alembic>=1.14",             # database migrations ("renovation instructions")
    "pyodbc>=5.2",               # Python ↔ ODBC Driver 18 ↔ SQL Server
    "pydantic-settings>=2.6",    # reads configuration from environment variables / .env
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northstar_payments"]

[tool.ruff]
line-length = 110
target-version = "py312"
